{{- $owner := site.Params.copyright_owner | default site.Title -}}
{{- $suffix := site.Params.copyright_suffix | default "All rights reserved." -}}
<footer class="footer">
  <div class="footer__inner">
    <p class="footer__copyright">&copy; {{ now.Year }} {{ $owner }}{{ with $suffix }}. {{ . }}{{ end }}</p>
  </div>
</footer>
