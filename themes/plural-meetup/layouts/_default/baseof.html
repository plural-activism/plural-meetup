<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}">
  <a class="skip-link" href="#main">{{ site.Params.skip_link_text | default "Skip to content" }}</a>

  {{ partial "header.html" . }}

  <main class="site-main" id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
